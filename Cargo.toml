[package]
name = "zontologize"
version = "0.0.1"
edition = "2024"
authors = ["Arsalan Anwari"]
description = "Point zontologize at a folder and get an ontology back. A pure-Rust CLI that crawls mixed data sources, extracts concepts and relationships, and builds a structured ontology."
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/ZAL-Analytics/zontologize"
homepage = "https://github.com/ZAL-Analytics/zontologize"
documentation = "https://docs.rs/zontologize"
keywords = ["ontology", "knowledge-graph", "extraction", "documents", "cli"]
categories = ["command-line-utilities", "text-processing"]
include = ["src/**/*", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "migrate", "macros"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "time", "sync"] }
toml = "1.1"
xberg = { version = "=1.3.10", default-features = false, features = ["tokio-runtime", "pdf", "office", "excel", "email", "html", "paddle-ocr"] }
whoami = { version = "2", default-features = false, features = ["std"] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "zontologize"
path = "src/main.rs"

[[bench]]
name = "extract"
harness = false
