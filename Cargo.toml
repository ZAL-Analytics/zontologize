[package]
name = "zontologize"
version = "1.1.0"
edition = "2024"
authors = ["Arsalan Anwari"]
description = "A Rust CLI that indexes folders into PostgreSQL, shaped by an OWL ontology (Turtle)."
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/ZAL-Analytics/zontologize"
homepage = "https://github.com/ZAL-Analytics/zontologize"
documentation = "https://docs.rs/zontologize"
keywords = ["ontology", "knowledge-graph", "extraction", "documents", "cli"]
categories = ["command-line-utilities", "text-processing"]
include = ["/src/**/*", "/defaults/**/*", "/prompts/**/*", "/migrations/**/*", "/benches/**/*", "/Cargo.toml", "/README.md", "/LICENSE"]

[features]
gpu = ["ort/cuda", "ort/copy-dylibs", "xberg/cuda"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "migrate", "macros", "chrono", "json"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "time", "sync", "process", "io-util", "io-std", "signal"] }
toml = "1.1"
xberg = { version = "=1.3.10", default-features = false, features = ["tokio-runtime", "pdf", "office", "excel", "email", "html", "paddle-ocr", "chunking"] }
xberg-native-pdf = "=1.3.10"
oxttl = "0.2.5"
oxrdf = "0.3.5"
csv = "1.4"
regex = "1.13"
regex-syntax = "0.8"
aho-corasick = "1.1"
walkdir = "2.5"
globset = "0.4"
sha2 = "0.11"
serde_json = { version = "1.0", features = ["raw_value"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "api-18"] }
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
hf-hub = { version = "1.0", default-features = false, features = ["blocking"] }
strsim = "0.11"
unicode-normalization = "0.1"
rayon = "1.12"

[lib]
path = "src/lib.rs"

[[bin]]
name = "zontologize"
path = "src/main.rs"

[[bench]]
name = "extract"
harness = false

[[bench]]
name = "stages"
harness = false

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
