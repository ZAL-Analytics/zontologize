[database]
schema = "zontologize"
max_connections = 8

[extract]
threads = 8
timeout_secs = 120
format = "markdown"
embedded_depth = 0
max_embedded_mb = 10
ocr_embedded_images = false
workers = 2
worker_memory_mb = 4000
worker_files = 200

[ocr]
languages = ["nl", "en"]
model_tier = "small"

[ontology]
files = ["ontology/acme.ttl"]
languages = ["en", "nl"]
include = ["acme:Organisation", "acme:Site", "acme:Project", "acme:Procedure", "acme:Equipment", "acme:Document"]
exclude = []
document_class = "acme:Document"

[scan]
batch_size = 1000
hash_threads = 0
ignore = ["**/~$*", "**/.~lock.*#", "**/Thumbs.db", "**/.DS_Store"]

[scan.kinds.pdf]
extensions = ["pdf"]
max_mb = 200

[scan.kinds.word]
extensions = ["doc", "docx", "rtf"]
max_mb = 50

[scan.kinds.sheet]
extensions = ["xls", "xlsx", "csv"]
max_mb = 50

[scan.kinds.mail]
extensions = ["eml", "msg"]
max_mb = 25

[scan.kinds.text]
extensions = ["txt", "html", "htm"]
max_mb = 10

[scan.kinds.image]
extensions = ["png", "jpg", "jpeg", "tif", "tiff"]
max_mb = 50

[chunk]
max_chars = 2000
overlap = 200
text_search = "simple"

[models]
fit = "claude-code:sonnet"
extract = "claude-code:sonnet"
classify = "claude-code:haiku"
# fit = "claude-code:haiku"
# fit = "openrouter:anthropic/claude-haiku-5.5"
# fit = "ollama:qwen3.5:4b"
chars_per_token = 2.0

[providers.claude-code]
concurrency = 2
timeout_secs = 300
max_window_use = 0.8

[providers.openrouter]
base_url = "https://openrouter.ai/api/v1"
concurrency = 8
timeout_secs = 120
poll_minutes = 30

[providers.ollama]
concurrency = 1
timeout_secs = 900
think = false

[budget]
max_usd = 1.0
max_requests = 0
calibration_calls = 200
default_output_tokens = 300

[fit]
sample = 200
seed = "acme"
unmatched_share = 0.3
min_chars = 100
max_shortlist = 30
min_evidence = 2
proposal_namespace = "https://example.org/acme/proposal#"
out = "fit"

[llm_extract]
min_chars = 100
sources = []
doc_types = []
paths = []
seed = "acme"
max_per_document = 3
unmatched_share = 0.3
min_letter_share = 0.5
min_ocr_confidence = 0.6
max_shortlist = 30
confidence = 0.7
resend_share = 0.2
min_evidence = 1
out = "extract"

[classify]
head_chars = 1500
min_chars = 50
confidence = 0.7

[review]
sample = 50
min_verdicts = 30

[[sources]]
name = "projects"
kind = "folder"
root = "../../tests/fixtures/acme/projects"
dataset = "current"
ignore = []

[[sources]]
name = "archive"
kind = "folder"
root = "../../tests/fixtures/acme/archive"
dataset = "legacy"
ignore = ["**/*.bak"]
