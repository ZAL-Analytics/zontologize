[database]
schema = "zontologize"
max_connections = 8

[extract]
threads = 0
timeout_secs = 300
format = "markdown"
embedded_depth = 0
max_embedded_mb = 10
ocr_embedded_images = false
workers = 0
worker_memory_mb = 0
worker_files = 500

[ocr]
languages = ["en"]
model_tier = "small"

[ontology]
files = []
languages = ["en"]
include = []
exclude = []
document_class = ""

[scan]
batch_size = 1000
hash_threads = 0
ignore = [
    "**/~$*",
    "**/.~lock.*#",
    "**/~*.tmp",
    "**/Thumbs.db",
    "**/desktop.ini",
    "**/.DS_Store",
    "**/._*",
    "**/.git/**",
]

[scan.kinds.pdf]
extensions = ["pdf"]
max_mb = 0

[scan.kinds.word]
extensions = ["doc", "docx", "docm", "odt", "rtf"]
max_mb = 0

[scan.kinds.sheet]
extensions = ["xls", "xlsx", "xlsm", "xlsb", "ods", "csv", "tsv"]
max_mb = 0

[scan.kinds.slides]
extensions = ["ppt", "pptx", "pptm", "odp"]
max_mb = 0

[scan.kinds.mail]
extensions = ["eml", "msg"]
max_mb = 0

[scan.kinds.text]
extensions = ["txt", "md", "html", "htm", "json"]
max_mb = 0

[scan.kinds.image]
extensions = ["png", "jpg", "jpeg", "tif", "tiff", "bmp", "webp"]
max_mb = 0

[chunk]
max_chars = 2000
overlap = 200
text_search = "simple"

[models]
fit = "claude-code:sonnet"
chars_per_token = 2.0

[providers.claude-code]
concurrency = 2
timeout_secs = 300
max_window_use = 0.8

[providers.openrouter]
base_url = "https://openrouter.ai/api/v1"
concurrency = 8
timeout_secs = 120
poll_minutes = 30

[providers.ollama]
concurrency = 1
timeout_secs = 900
think = false

[budget]
max_usd = 0
max_requests = 0
calibration_calls = 200
default_output_tokens = 300

[fit]
sample = 1000
seed = "zontologize"
unmatched_share = 0.3
min_chars = 200
max_shortlist = 30
min_evidence = 3
proposal_namespace = "urn:zontologize:proposal#"
out = "fit"
