[database]
schema = "zontologize"
max_connections = 8

[extract]
threads = 0
timeout_secs = 300
format = "markdown"
embedded_depth = 0
max_embedded_mb = 10
ocr_embedded_images = false
workers = 0
worker_memory_mb = 0
worker_files = 500

[ocr]
languages = ["en"]
model_tier = "small"

[ontology]
files = []
languages = ["en"]
include = []
exclude = []
document_class = ""

[scan]
batch_size = 1000
hash_threads = 0
ignore = [
    "**/~$*",
    "**/.~lock.*#",
    "**/~*.tmp",
    "**/Thumbs.db",
    "**/desktop.ini",
    "**/.DS_Store",
    "**/._*",
    "**/.git/**",
]

[scan.kinds.pdf]
extensions = ["pdf"]
max_mb = 0

[scan.kinds.word]
extensions = ["doc", "docx", "docm", "odt", "rtf"]
max_mb = 0

[scan.kinds.sheet]
extensions = ["xls", "xlsx", "xlsm", "xlsb", "ods", "csv", "tsv"]
max_mb = 0

[scan.kinds.slides]
extensions = ["ppt", "pptx", "pptm", "odp"]
max_mb = 0

[scan.kinds.mail]
extensions = ["eml", "msg"]
max_mb = 0

[scan.kinds.text]
extensions = ["txt", "md", "html", "htm", "json"]
max_mb = 0

[scan.kinds.image]
extensions = ["png", "jpg", "jpeg", "tif", "tiff", "bmp", "webp"]
max_mb = 0

[chunk]
max_chars = 2000
overlap = 200
text_search = "simple"

[models]
fit = "claude-code:sonnet"
extract = "claude-code:sonnet"
classify = "claude-code:haiku"
embed = "local:multilingual-e5-base"
chars_per_token = 2.0

[providers.claude-code]
concurrency = 2
timeout_secs = 300
max_window_use = 0.8

[providers.openrouter]
base_url = "https://openrouter.ai/api/v1"
concurrency = 8
timeout_secs = 120
poll_minutes = 30

[providers.ollama]
concurrency = 1
timeout_secs = 900
think = false

[budget]
max_usd = 0
max_requests = 0
calibration_calls = 200
default_output_tokens = 300

[fit]
sample = 1000
seed = "zontologize"
unmatched_share = 0.3
min_chars = 200
max_shortlist = 30
min_evidence = 3
proposal_namespace = "urn:zontologize:proposal#"
out = "fit"

[llm_extract]
min_chars = 200
sources = []
doc_types = []
paths = []
exclude = []
seed = "zontologize"
max_per_document = 3
unmatched_share = 0.3
min_letter_share = 0.5
min_ocr_confidence = 0.6
max_shortlist = 30
confidence = 0.7
resend_share = 0.2
min_evidence = 3
out = "extract"

[classify]
head_chars = 1500
min_chars = 50
confidence = 0.7

[review]
sample = 50
min_verdicts = 30

[embed]
threads = 0
batch_size = 8
max_tokens = 512
min_chars = 50
min_letter_share = 0.5
min_ocr_confidence = 0.6
max_aliases = 5
cache_dir = ""
out = "eval"
eval_sample = 500
eval_max_expected = 20

[embed.models."multilingual-e5-base"]
repo = "intfloat/multilingual-e5-base"
revision = "d128750597153bb5987e10b1c3493a34e5a4502a"
file = "onnx/model.onnx"
data_files = []
tokenizer = "tokenizer.json"
pooling = "mean"
output = ""
normalize = true
passage_prefix = "passage: "
query_prefix = "query: "
max_tokens = 512

[embed.models."multilingual-e5-small"]
repo = "intfloat/multilingual-e5-small"
revision = "614241f622f53c4eeff9890bdc4f31cfecc418b3"
file = "onnx/model.onnx"
data_files = []
tokenizer = "tokenizer.json"
pooling = "mean"
output = ""
normalize = true
passage_prefix = "passage: "
query_prefix = "query: "
max_tokens = 512

[embed.models."bge-m3"]
repo = "BAAI/bge-m3"
revision = "5617a9f61b028005a4858fdac845db406aefb181"
file = "onnx/model.onnx"
data_files = ["onnx/model.onnx_data", "onnx/Constant_7_attr__value"]
tokenizer = "onnx/tokenizer.json"
pooling = "cls"
output = ""
normalize = true
passage_prefix = ""
query_prefix = ""
max_tokens = 512

[embed.models."arctic-embed-m-v2.0"]
repo = "Snowflake/snowflake-arctic-embed-m-v2.0"
revision = "95c2741480856aa9666782eb4afe11959938017f"
file = "onnx/model.onnx"
data_files = []
tokenizer = "tokenizer.json"
pooling = "cls"
output = ""
normalize = true
passage_prefix = ""
query_prefix = "query: "
max_tokens = 512

[embed.models."qwen3-embedding-0.6b"]
repo = "onnx-community/Qwen3-Embedding-0.6B-ONNX"
revision = "c25a394dd583836952667c12f008335071b3f43d"
file = "onnx/model.onnx"
data_files = ["onnx/model.onnx_data"]
tokenizer = "tokenizer.json"
pooling = "last"
output = ""
normalize = true
passage_prefix = ""
query_prefix = "Instruct: Given a question, retrieve passages that answer it\nQuery:"
max_tokens = 512

[resolve]
strip_words = []
fuzzy_score = 0.92
embed_score = 0.9
max_candidates = 5
max_block = 1000
block_chars = 4
classes = []
